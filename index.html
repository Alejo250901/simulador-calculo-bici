
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Interactivo de Carga y Gestión Energética</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-6">
<div class="max-w-5xl mx-auto">
<h1 class="text-3xl font-bold text-emerald-400 text-center mb-2">Simulador Interactivo de Carga y Gestión Energética</h1>
<p class="text-center text-slate-400 mb-6">Estimación de tiempo de carga para bicicletas y patinetas eléctricas</p>
<div class="grid md:grid-cols-3 gap-6">
<div class="bg-slate-800 p-5 rounded-2xl">
<button id="oferoBtn" class="w-full bg-emerald-600 p-2 rounded mb-4">Usar configuración Ofero Stareer 3 Lit</button>
<label>Batería inicial: <span id="socVal">30</span>%</label>
<input type="range" id="soc" min="0" max="95" value="30" class="w-full">
<label>Carga objetivo: <span id="targetVal">80</span>%</label>
<input type="range" id="target" min="10" max="100" value="80" class="w-full">
<label>Capacidad: <span id="capVal">800</span> Wh</label>
<input type="range" id="cap" min="200" max="1500" value="800" class="w-full">
<label>Tipo de cargador</label>
<select id="power" class="w-full text-black p-2 rounded">
<option value="84">42V-2A (84W)</option>
<option value="126">42V-3A (126W)</option>
<option value="144">48V-3A (144W)</option>
<option value="164" selected>54.6V-3A (164W)</option>
<option value="218">54.6V-4A (218W)</option>
<option value="273">54.6V-5A (273W)</option>
</select>
<div class="mt-4 p-3 bg-slate-900 rounded">
<div class="text-xs">TIEMPO ESTIMADO DE CARGA</div>
<div id="time" class="text-3xl font-bold text-emerald-400"></div>
<div id="energy" class="text-sm text-sky-400 mt-2"></div>
<div id="advice" class="text-sm mt-2"></div>
</div>
</div>
<div class="md:col-span-2 bg-slate-800 p-5 rounded-2xl">
<canvas id="chart"></canvas>
</div>
</div>
</div>
<script>
const soc=document.getElementById('soc');
const target=document.getElementById('target');
const cap=document.getElementById('cap');
const power=document.getElementById('power');
const chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels:[],datasets:[{label:'Potencia P(t)',data:[],borderColor:'#34d399',backgroundColor:'rgba(52,211,153,.2)',fill:true}]}});
function update(){
let s=+soc.value,t=+target.value,c=+cap.value,p=+power.value;
if(t<=s){t=s+1;target.value=t;}
document.getElementById('socVal').innerText=s;
document.getElementById('targetVal').innerText=t;
document.getElementById('capVal').innerText=c;
const energy=c*((t-s)/100);
let time;
if(t<=80){time=energy/p;}
else{
 const e1=c*((Math.max(80,s)-s)/100);
 const e2=Math.max(0,c*((t-Math.max(80,s))/100));
 time=(e1/p)+(e2/(p*0.6));
}
const h=Math.floor(time); const m=Math.round((time-h)*60);
document.getElementById('time').innerText=`${h} h ${m} min`;
document.getElementById('energy').innerText=`Energía aproximada requerida: ${energy.toFixed(1)} Wh`;
const adv=document.getElementById('advice');
if(t<80){adv.innerText='Carga eficiente para trayectos cortos.';adv.className='text-green-400';}
else if(t<=90){adv.innerText='Nivel recomendado para equilibrar autonomía y vida útil.';adv.className='text-green-400';}
else if(t<100){adv.innerText='Las cargas frecuentes por encima del 90% pueden aumentar el desgaste.';adv.className='text-yellow-400';}
else{adv.innerText='Las cargas frecuentes al 100% pueden acelerar la degradación de la batería.';adv.className='text-orange-400';}
let labels=[],data=[]; let steps=30;
for(let i=0;i<=steps;i++){
 let x=time*i/steps; labels.push(x.toFixed(1));
 let sat=time*0.8;
 let val=x<=sat?p:p*Math.exp(-1.5*(x-sat));
 data.push(Math.max(val,5));
}
chart.data.labels=labels; chart.data.datasets[0].data=data; chart.update();
}
[soc,target,cap,power].forEach(e=>e.addEventListener('input',update));
document.getElementById('oferoBtn').onclick=()=>{cap.value=1152;power.value='164';update();};
update();
</script>
</body></html>
